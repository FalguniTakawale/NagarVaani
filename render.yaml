# Render Blueprint — one web service, no database resource.
# In the Render dashboard: New → Blueprint → point at this repo.
# Secrets marked sync: false are entered once in the dashboard, never committed.
#
# SQLite, not Postgres: provisioning a Render database (even the free plan)
# requires a payment method on file for anti-abuse verification, which a
# plain web service alone doesn't. This trades that off against Render's
# free web service having an ephemeral filesystem — data (accounts,
# complaints) doesn't reliably survive a redeploy or a crash restart, only
# ordinary idle spin-down/wake. Fine for a demo/judging session; re-run
# `python seed_data.py` from the Shell tab if the demo data disappears.
# Swap DATABASE_URL for a real Postgres URL (Render's own, or any other
# provider) whenever you're ready for a deployment that keeps its data.
services:
  - type: web
    name: nagarvaani
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: python setup_db.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://nagarvaani.onrender.com   # change to your service URL
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./nagarvaani.db
      - key: JWT_SECRET
        generateValue: true
      # ai_engine.py's active default provider — required for the AI pipeline
      # (filter/classify/score/translate/chatbot) to actually work. Get one
      # free at aistudio.google.com/apikey.
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional — "Continue with Google" sign-in. Leave blank to skip; the
      # button just stays hidden. See Backend/.env.example for setup.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY          # OTP + notification email over HTTPS (Render free blocks SMTP)
        sync: false
      - key: BREVO_SENDER_EMAIL     # must be a verified sender in Brevo
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
